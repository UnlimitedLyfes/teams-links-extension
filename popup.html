<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main class="popup-shell">
        <header class="popup-header">
            <div>
                <p class="eyebrow">Meeting Links</p>
                <h1>Current meeting</h1>
            </div>
            <button class="icon-button" id="optionsButton" type="button" aria-label="Open options" title="Open options">
                <img src="icons/gear.png" alt="">
            </button>
        </header>

        <section class="meeting-card" aria-live="polite">
            <p class="status-label">Now</p>
            <p class="current">Checking schedule...</p>
            <p class="meeting-time"></p>
        </section>

        <a class="linkbutton is-disabled" target="_blank" rel="noopener noreferrer" aria-disabled="true">Go to meeting</a>
    </main>

    <script src="popup.js"></script>
</body>
</html>
